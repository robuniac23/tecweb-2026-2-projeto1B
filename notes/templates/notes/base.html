{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Get-it</title>
    <link rel="stylesheet" href="{% static 'notes/getit.css' %}" />
  </head>

  <body>
    <div class="appbar">
      <img class="logo" src="{% static 'notes/img/logo-getit.png' %}" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    </div>

    {% block content %} {% endblock %}

    <!-- Popup de confirmação de exclusão -->
    <div class="popup-overlay" id="popup-overlay">
      <div class="popup-box">
        <p class="popup-question">
          Deseja realmente excluir "<span id="popup-title"></span>"?
        </p>
        <p id="popup-details"></p>
        <div class="popup-buttons">
          <a class="btn btn-cancel" id="popup-cancel" href="#">Cancelar</a>
          <a class="btn btn-confirm" id="popup-confirm" href="#">Excluir</a>
        </div>
      </div>
    </div>

    <script src="{% static 'notes/getit.js' %}"></script>
  </body>
</html>
