{% extends "notes/base.html" %}

{% block content %}
<div class="container">
  <h2>{{ tag.name }}</h2>
  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <h3 class="card-title">{{ note.title }}</h3>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
